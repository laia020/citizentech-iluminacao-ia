[project]
name = "citizentech-iluminacao-ia"
version = "0.1.0"
description = "Análise preliminar de iluminação pública com RAG e fine-tuning local"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2.10,<3", "numpy>=2", "scikit-learn>=1.6", "pyyaml>=6", "httpx>=0.28"]
[project.optional-dependencies]
train = ["mlx-lm[train]", "huggingface-hub", "psutil"]
[dependency-groups]
dev = ["pytest>=8", "nbformat>=5", "nbclient>=0.10", "ipykernel>=6", "ruff>=0.9"]
[project.scripts]
citizentech = "citizentech_ia.cli:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/citizentech_ia"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
[tool.ruff]
line-length = 110
